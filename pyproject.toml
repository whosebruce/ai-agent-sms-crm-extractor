[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-crm-extractor"
version = "0.2.0"
description = "Local-first Android contacts + SMS Backup & Restore XML to contractor CRM extractor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sms-crm = "sms_crm_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sms_crm_extractor*"]

[tool.setuptools.package-data]
sms_crm_extractor = ["assets/fonts/*"]
